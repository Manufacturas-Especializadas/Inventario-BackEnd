# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-mesa-inventario-api-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./src/PPEInventory.Api/PPEInventory.Api.csproj

      - name: Build
        run: dotnet build ./src/PPEInventory.Api/PPEInventory.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/PPEInventory.Api/PPEInventory.Api.csproj -c Release -o ./publish --no-build

      - name: List publish output
        run: ls -la ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4DEFB9FBB399411E9D21A89E051C406D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3EA9C7F8C8A745CAB0774C1DA7FC773F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7BE2C2801C2C4B459D0C96573C45ECBB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-mesa-inventario-api-prod'
          slot-name: 'Production'
          package: ./publish
